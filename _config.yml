# GitHub Pages (legacy Jekyll build from the repo root) still serves the static
# site at maewoeste.com. Only the root *.html pages, favicon.png, CNAME and
# public/ (images + audio) belong there. Everything else is the Vercel app and
# must never be published, because lib/content holds sign-in-only Study text.
exclude:
  - app
  - components
  - content
  - db
  - lib
  - scripts
  - tests
  - types
  - node_modules
  - middleware.ts
  - next.config.ts
  - next-env.d.ts
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.tsbuildinfo
  - vercel.json
  - vitest.config.ts
  - README.md

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Match | Mae's Game Lab</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #2c3e50;
        }
        nav { margin-bottom: 20px; }
        nav a {
            color: white;
            text-decoration: none;
            margin: 4px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #5a67d8, #7c3aed);
            border-radius: 25px;
            display: inline-block;
        }
        #game-container {
            background: white;
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button {
            font-size: 20px;
            padding: 12px 18px;
            margin: 5px;
            cursor: pointer;
            background: linear-gradient(135deg, #5a67d8, #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
        }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        button:focus-visible { outline: 3px solid #f1c40f; outline-offset: 2px; }
        .number-btn { min-width: 56px; }
        #scoreboard {
            display: flex;
            justify-content: space-around;
            font-size: 1.3em;
            font-weight: 700;
            margin: 16px 0;
        }
        #prompt { font-size: 1.3em; min-height: 2em; }
        #countdown { font-size: 5em; font-weight: 800; color: #7c3aed; min-height: 1.2em; }
        #reveal { display: flex; justify-content: space-around; font-size: 1.2em; min-height: 5em; }
        .reveal-num { font-size: 3em; font-weight: 800; display: block; }
        #result { font-size: 1.4em; min-height: 1.6em; margin: 10px 0; font-weight: 700; }
        .match { color: #27ae60; }
        .miss { color: #e74c3c; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="games.html">🎮 Game Lab</a>
        <a href="spelling-game.html">📚 Spelling Game</a>
    </nav>
    <h1>🔢 Number Match</h1>

    <div id="game-container">
        <div id="setup">
            <p>How big should the numbers be?</p>
            <div role="group" aria-label="Choose the biggest number">
                <button onclick="startGame(3)">1 to 3</button>
                <button onclick="startGame(5)">1 to 5</button>
                <button onclick="startGame(10)">1 to 10</button>
            </div>
            <p>Take turns matching numbers. First to 5 points wins!</p>
        </div>

        <div id="play" class="hidden">
            <div id="scoreboard" aria-live="polite">
                <span>You: <span id="player-score">0</span></span>
                <span>Computer: <span id="computer-score">0</span></span>
            </div>
            <p id="prompt" aria-live="polite"></p>
            <div id="number-buttons" role="group" aria-label="Pick a number"></div>
            <div id="countdown" aria-live="assertive"></div>
            <div id="reveal"></div>
            <p id="result" aria-live="assertive"></p>
            <button id="next-button" class="hidden" onclick="nextRound()">Next ▶</button>
            <button id="again-button" class="hidden" onclick="showSetup()">Play Again</button>
        </div>
    </div>
    <h3>Created by: Mae Woeste</h3>

    <script>
        const WIN_SCORE = 5;
        let maxNumber = 5;
        let playerScore = 0;
        let computerScore = 0;
        // true: you guess the computer's secret number. false: the computer guesses yours.
        let playerGuesses = true;
        let busy = false;

        function randomNumber() {
            return Math.floor(Math.random() * maxNumber) + 1;
        }

        function startGame(max) {
            maxNumber = max;
            playerScore = 0;
            computerScore = 0;
            playerGuesses = true;
            document.getElementById("setup").classList.add("hidden");
            document.getElementById("play").classList.remove("hidden");
            document.getElementById("again-button").classList.add("hidden");
            updateScores();
            startRound();
        }

        function showSetup() {
            document.getElementById("play").classList.add("hidden");
            document.getElementById("setup").classList.remove("hidden");
        }

        function updateScores() {
            document.getElementById("player-score").innerText = playerScore;
            document.getElementById("computer-score").innerText = computerScore;
        }

        function startRound() {
            busy = false;
            document.getElementById("countdown").innerText = "";
            document.getElementById("reveal").innerHTML = "";
            document.getElementById("result").innerText = "";
            document.getElementById("result").className = "";
            document.getElementById("next-button").classList.add("hidden");
            document.getElementById("prompt").innerText = playerGuesses
                ? "Your turn to guess! Pick a number from 1 to " + maxNumber + "."
                : "Computer's turn to guess! Pick a secret number from 1 to " + maxNumber + ".";

            const container = document.getElementById("number-buttons");
            container.innerHTML = "";
            for (let n = 1; n <= maxNumber; n++) {
                const button = document.createElement("button");
                button.className = "number-btn";
                button.innerText = n;
                button.setAttribute("aria-label", "Number " + n);
                button.onclick = () => playRound(n);
                container.appendChild(button);
            }
            container.querySelector("button").focus();
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll("#number-buttons button").forEach(b => b.disabled = disabled);
        }

        function playRound(playerNumber) {
            if (busy) return;
            busy = true;
            setButtonsDisabled(true);
            const computerNumber = randomNumber();
            document.getElementById("prompt").innerText = "Get ready...";
            let count = 3;
            const countdown = document.getElementById("countdown");
            countdown.innerText = count;
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdown.innerText = count;
                } else {
                    clearInterval(timer);
                    countdown.innerText = "";
                    reveal(playerNumber, computerNumber);
                }
            }, 1000);
        }

        function reveal(playerNumber, computerNumber) {
            document.getElementById("reveal").innerHTML =
                "<div>Your number<span class='reveal-num'>" + playerNumber + "</span></div>" +
                "<div>Computer's number<span class='reveal-num'>" + computerNumber + "</span></div>";

            const matched = playerNumber === computerNumber;
            const result = document.getElementById("result");
            if (matched) {
                if (playerGuesses) playerScore++; else computerScore++;
                result.innerText = playerGuesses ? "🎯 You matched it! +1 for you!" : "🤖 The computer matched you! +1 for the computer!";
                result.className = playerGuesses ? "match" : "miss";
                if (playerGuesses) confetti();
            } else {
                result.innerText = "No match this time.";
                result.className = "miss";
            }
            updateScores();

            if (playerScore >= WIN_SCORE || computerScore >= WIN_SCORE) {
                const won = playerScore >= WIN_SCORE;
                result.innerText = won ? "🎉 You win! 🎉" : "🤖 The computer wins! Good game!";
                result.className = won ? "match" : "miss";
                if (won) confetti({ particleCount: 200, spread: 90 });
                document.getElementById("prompt").innerText = "";
                document.getElementById("again-button").classList.remove("hidden");
                document.getElementById("again-button").focus();
            } else {
                document.getElementById("prompt").innerText = "";
                document.getElementById("next-button").classList.remove("hidden");
                document.getElementById("next-button").focus();
            }
        }

        function nextRound() {
            playerGuesses = !playerGuesses;
            startRound();
        }
    </script>
</body>
</html>

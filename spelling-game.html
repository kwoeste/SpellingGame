<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Safari | List D-1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        #game-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            position: relative;
        }
        #letter-buttons {
            margin-top: 20px;
        }
        button {
            font-size: 18px;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        #message {
            font-size: 20px;
            margin-top: 10px;
        }
        .correct {
            background: #2ecc71;
        }
        .incorrect {
            background: #e74c3c;
        }
        #voice-controls {
            margin-top: 15px;
            font-size: 16px;
        }
        #voice-controls select {
            font-size: 16px;
            padding: 6px;
            max-width: 220px;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 1em;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 25px;
            display: inline-block;
        }
        nav a:hover {
            opacity: 0.9;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="store.html">🛒 Shop</a>
        <a href="spelling-game.html">📚 Spelling Game</a>
        <a href="games.html">🎮 Game Lab</a>
    </nav>
    <h1>Spelling List D-1: Short a and Short e</h1>
    <div id="game-container">
        <p id="word-hint" aria-live="polite">Spell the word: _ _ _ _</p>
        <div id="letter-buttons" role="group" aria-label="Letter choices"></div>
        <p id="message" aria-live="assertive"></p>
        <button id="replay-button" onclick="replayWord()" aria-label="Replay word pronunciation">🔊 Replay Word</button>
        <div id="voice-controls">
            <label for="voice-select">Voice:</label>
            <select id="voice-select" onchange="changeVoice()"></select>
            <label for="speed-select">Speed:</label>
            <select id="speed-select" onchange="changeSpeed()">
                <option value="0.7">Slow</option>
                <option value="0.85">Normal</option>
                <option value="1">Fast</option>
            </select>
        </div>
    </div>
    <h3>Created by: Mae Woeste</h3>
    
    <script>
        const words = [
            "package", "dwell", "activity", "festive", "spend", "attitude", "elephant", "alligator", "shelf", "bandage", "measure", "rapid", "nonsense", "scrap", "meant", "taxes", "enter", "camper", "eggplant", "special", "edit", "began", "ramp", "absence", "except"
        ];

        // Add sentences for each word
        const wordSentences = {
            "package": "The mail carrier brought a package to the door.",
            "dwell": "Some animals dwell in caves.",
            "activity": "Painting is my favorite activity.",
            "festive": "The room looked festive with balloons.",
            "spend": "I like to spend time with my family.",
            "attitude": "A good attitude makes learning fun.",
            "elephant": "The elephant sprayed water with its trunk.",
            "alligator": "The alligator slid into the swamp.",
            "shelf": "Put the book back on the shelf.",
            "bandage": "She put a bandage on her knee.",
            "measure": "Use a ruler to measure the line.",
            "rapid": "The rapid river rushed over the rocks.",
            "nonsense": "That silly rhyme is nonsense.",
            "scrap": "I used a scrap of paper to write a note.",
            "meant": "I meant to say thank you.",
            "taxes": "People pay taxes to help build roads.",
            "enter": "Please knock before you enter the room.",
            "camper": "The camper zipped up the tent.",
            "eggplant": "We cooked eggplant for dinner.",
            "special": "Today is a special day.",
            "edit": "Please edit your story and fix mistakes.",
            "began": "The show began at noon.",
            "ramp": "The skateboard rolled down the ramp.",
            "absence": "Her absence from school was because she was sick.",
            "except": "Everyone came except Sam."
        };

        let currentIndex = 0;
        let currentWord = "";
        let guessedWord = "";
        let currentLetterIndex;

        function showWord() {
            if (currentIndex < words.length) {
                currentWord = words[currentIndex];
                guessedWord = "_".repeat(currentWord.length);
                currentLetterIndex = 0;
                updateWordDisplay();
                displayLetterButtons();
                document.getElementById("message").innerText = "";
                sayWordAndSentence(currentWord);
            } else {
                document.getElementById("game-container").innerHTML = "<h2>🎉 Congratulations! You finished all words! 🎉</h2>";
            }
        }

        function updateWordDisplay() {
            document.getElementById("word-hint").innerText = "Spell the word: " + guessedWord.split('').join(' ');
        }

        function displayLetterButtons() {
            let letterContainer = document.getElementById("letter-buttons");
            letterContainer.innerHTML = "";
            let letters = currentWord.split('');
            let extraLetters = shuffleArray('abcdefghijklmnopqrstuvwxyz'.split('')).slice(0, 3);
            let allLetters = letters.concat(extraLetters).sort(() => Math.random() - 0.5);
            allLetters.forEach(letter => {
                let button = document.createElement("button");
                button.innerText = letter;
                button.onclick = () => guessLetter(letter, button);
                letterContainer.appendChild(button);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let voices = [];
        let selectedVoiceName = localStorage.getItem("spellingVoice") || "";
        let speechRate = parseFloat(localStorage.getItem("spellingRate")) || 0.85;

        // Higher score = nicer sounding. Names vary by browser and device.
        function voiceScore(v) {
            if (!v.lang.startsWith("en")) return -1;
            let score = v.lang === "en-US" ? 2 : 1;
            if (/natural|neural|online/i.test(v.name)) score += 10;
            if (/Google US English|Samantha|Ava|Allison|Aria|Jenny|Karen|Moira/i.test(v.name)) score += 5;
            return score;
        }

        function loadVoices() {
            voices = window.speechSynthesis.getVoices().filter(v => voiceScore(v) >= 0);
            voices.sort((a, b) => voiceScore(b) - voiceScore(a));
            const select = document.getElementById("voice-select");
            select.innerHTML = "";
            voices.forEach(v => {
                const option = document.createElement("option");
                option.value = v.name;
                option.textContent = v.name;
                select.appendChild(option);
            });
            if (!voices.some(v => v.name === selectedVoiceName) && voices.length) {
                selectedVoiceName = voices[0].name;
            }
            select.value = selectedVoiceName;
            document.getElementById("speed-select").value = String(speechRate);
        }

        function changeVoice() {
            selectedVoiceName = document.getElementById("voice-select").value;
            localStorage.setItem("spellingVoice", selectedVoiceName);
            replayWord();
        }

        function changeSpeed() {
            speechRate = parseFloat(document.getElementById("speed-select").value);
            localStorage.setItem("spellingRate", speechRate);
            replayWord();
        }

        function makeUtterance(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            utterance.rate = speechRate;
            const voice = voices.find(v => v.name === selectedVoiceName);
            if (voice) {
                utterance.voice = voice;
                utterance.lang = voice.lang;
            }
            return utterance;
        }

        function sayWordAndSentence(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speechWord = makeUtterance(word);
                const speechSentence = makeUtterance(wordSentences[word]);
                window.speechSynthesis.speak(speechWord);
                // Short pause between the word and the sentence
                speechWord.onend = () => {
                    setTimeout(() => window.speechSynthesis.speak(speechSentence), 600);
                };
            } else {
                console.warn('Speech synthesis not supported');
                document.getElementById("message").innerText = "Speech not supported in your browser";
            }
        }

        function replayWord() {
            if (currentWord) {
                sayWordAndSentence(currentWord);
            }
        }

        function guessLetter(letter, button) {
            if (letter === currentWord[currentLetterIndex]) {
                let newGuessedWord = guessedWord.split('');
                newGuessedWord[currentLetterIndex] = letter;
                guessedWord = newGuessedWord.join('');
                updateWordDisplay();
                button.disabled = true;
                button.classList.add('correct');
                currentLetterIndex++;
                checkCompletion();
            } else {
                document.getElementById("message").innerText = "❌ Try again! The next letter is incorrect.";
                button.classList.add('incorrect');
                setTimeout(() => button.classList.remove('incorrect'), 1000);
            }
        }

        function checkCompletion() {
            if (guessedWord === currentWord) {
                document.getElementById("message").innerText = "✅ Correct!";
                confetti();
                currentIndex++;
                setTimeout(showWord, 2000);
            }
        }

        function restartGame() {
            currentIndex = 0;
            showWord();
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        showWord();
    </script>
</body>
</html>

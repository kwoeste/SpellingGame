<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mae's Game Lab</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #2c3e50;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 4px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #5a67d8, #7c3aed);
            border-radius: 25px;
            display: inline-block;
        }
        .game-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 20px auto;
        }
        .game-card {
            background: white;
            width: 240px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: inherit;
        }
        .game-card:hover, .game-card:focus-visible { box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4); }
        .game-icon { font-size: 3em; }
        .game-card h2 { color: #5a67d8; margin: 8px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="store.html">🛒 Shop</a>
    </nav>
    <h1>🎮 Mae's Game Lab</h1>
    <p>Games invented by Mae Woeste. Pick one and play!</p>
    <div class="game-grid">
        <a class="game-card" href="spelling-game.html">
            <div class="game-icon">📚</div>
            <h2>Spelling Safari</h2>
            <p>Listen to the word and tap the letters in order.</p>
        </a>
        <a class="game-card" href="number-match.html">
            <div class="game-icon">🔢</div>
            <h2>Number Match</h2>
            <p>Match the computer's number. Play first to 3, 5, or 10!</p>
        </a>
    </div>
</body>
</html>
